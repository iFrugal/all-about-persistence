name: PR Checks

# The release workflow deliberately skips tests (-Dmaven.test.skip=true),
# so this workflow is the only place the test suites gate anything.
# It runs the full reactor's JUnit Jupiter and TestNG suites on every pull request,
# once per supported Spring Boot line and Java version.
# The suites need no external services: databases are in-memory (H2).

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Boot ${{ matrix.spring-boot }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: [ '3.5.16', '4.1.1' ]
        java: [ '21', '25' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp -Dgpg.skip=true -Dspring-boot.version=${{ matrix.spring-boot }} test
